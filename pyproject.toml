[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concilia"
version = "0.1.0"
description = "Conciliacion bancaria via WhatsApp"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "anthropic>=0.40,<1.0",
  "jinja2>=3.1,<4.0",
  "itsdangerous>=2.2,<3.0",
  "bcrypt>=4.2,<5.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]
turso = ["sqlalchemy-libsql>=0.1,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
