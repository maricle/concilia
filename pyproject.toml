[project]
name = "concilia"
version = "0.1.0"
description = "Conciliacion bancaria via WhatsApp"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
