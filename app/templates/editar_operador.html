{% extends "base.html" %}
{% block title %}Editar operador - Concilia{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4" style="max-width: 500px;">
  <h1 class="h3 mb-0 text-gray-800">Editar operador</h1>
  <a href="{{ volver_a(request, '/config/operadores') }}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left mr-1"></i>Volver al listado</a>
</div>

<div class="card shadow mb-4" style="max-width: 500px;">
  <div class="card-body">
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_actual(request) }}">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="form-control" name="nombre" value="{{ operador.nombre }}" required>
      </div>
      <div class="form-group">
        <label>Numero de telefono (sin codigo de pais)</label>
        <input type="text" class="form-control" name="whatsapp_numero" value="{{ operador.whatsapp_numero }}" required>
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select class="form-control" name="tipo">
          <option value="Reparto" {{ "selected" if operador.tipo == "Reparto" }}>Reparto</option>
          <option value="Administrativo" {{ "selected" if operador.tipo == "Administrativo" }}>Administrativo</option>
        </select>
      </div>
      <div class="form-group">
        <label>Movil</label>
        <select class="form-control" name="movil_id">
          <option value="">Sin movil</option>
          {% for movil in moviles %}
          <option value="{{ movil.id }}" {{ "selected" if operador.movil_id == movil.id }}>{{ movil.numero }} - {{ movil.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <p class="text-muted small">Telegram vinculado: {{ operador.telegram_chat_id or "todavia no vinculo su Telegram" }}</p>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{{ volver_a(request, '/config/operadores') }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
