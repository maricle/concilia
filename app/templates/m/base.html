<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141f">
<title>{% block title %}Concilia{% endblock %}</title>
<link rel="icon" href="/static/iconos/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/static/iconos/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/m/static/m.css">
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/m/static/iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Concilia">
<script src="/m/static/m.js" defer></script>
</head>
<body class="{% block clase_body %}{% endblock %}">
<header class="m-barra">
  <a class="m-marca" href="/m/">Concilia</a>
  {% if operador %}
  <form method="post" action="/m/logout">
    <button type="submit" class="m-link">Salir</button>
  </form>
  {% endif %}
</header>
<div id="aviso-sin-conexion" class="m-banda m-banda-alerta" hidden role="status">Sin conexión. Los comprobantes no se guardan en el celular.</div>
<div id="aviso-instalar" class="m-banda" hidden>
  <span id="aviso-instalar-texto">Instalá Concilia en tu celular para abrirla como una app.</span>
  <button type="button" id="aviso-instalar-boton" class="m-link" hidden>Instalar</button>
  <button type="button" id="aviso-instalar-cerrar" class="m-link" aria-label="Cerrar aviso">Ahora no</button>
</div>
<main class="m-contenido">
  {% block content %}{% endblock %}
</main>
</body>
</html>
