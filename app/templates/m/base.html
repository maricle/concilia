<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>{% block title %}Concilia{% endblock %}</title>
<link rel="stylesheet" href="/m/static/m.css">
</head>
<body>
<header class="m-barra">
  <span class="m-marca">Concilia</span>
  {% if operador %}
  <form method="post" action="/m/logout">
    <button type="submit" class="m-link">Salir</button>
  </form>
  {% endif %}
</header>
<main class="m-contenido">
  {% block content %}{% endblock %}
</main>
</body>
</html>
