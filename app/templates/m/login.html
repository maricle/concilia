{% extends "m/base.html" %}
{% block title %}Ingresar - Concilia{% endblock %}
{% block content %}
<h1>Ingresar</h1>
<p class="m-ayuda">Usá tu número de celular y tu PIN de 6 números.</p>
{% if error %}<p class="m-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/m/login" class="m-form">
  <label for="celular">Celular</label>
  <input id="celular" name="celular" type="tel" inputmode="tel" autocomplete="tel" required value="{{ celular }}">
  <label for="pin">PIN</label>
  <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" required>
  <button type="submit" class="m-boton">Ingresar</button>
</form>
<p class="m-ayuda">¿No tenés PIN o lo olvidaste? Pedíselo al administrador.</p>
{% endblock %}
