<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Concilia{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link href="/static/css/custom.css" rel="stylesheet">
<style>
  .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
</style>
</head>
<body id="page-top">
{% if user %}
<div id="wrapper">
  <ul class="navbar-nav sidebar sidebar-dark accordion" id="accordionSidebar">
    <a class="sidebar-brand d-flex align-items-center justify-content-center" href="/resumen">
      <div class="sidebar-brand-icon"><i class="fas fa-university"></i></div>
      <div class="sidebar-brand-text mx-3">Concilia</div>
    </a>
    <hr class="sidebar-divider my-0">
    <li class="nav-item {{ 'active' if request.url.path == '/resumen' }}">
      <a class="nav-link" href="/resumen"><i class="fas fa-fw fa-chart-pie"></i><span>Resumen</span></a>
    </li>
    <li class="nav-item {{ 'active' if request.url.path == '/comprobantes' }}">
      <a class="nav-link" href="/comprobantes"><i class="fas fa-fw fa-file-invoice-dollar"></i><span>Comprobantes</span></a>
    </li>
    <li class="nav-item {{ 'active' if request.url.path == '/conciliaciones' }}">
      <a class="nav-link" href="/conciliaciones"><i class="fas fa-fw fa-balance-scale"></i><span>Conciliaciones</span></a>
    </li>
    <hr class="sidebar-divider">
    <div class="sidebar-heading">Configuracion</div>
    <li class="nav-item {{ 'active' if request.url.path == '/config/operadores' }}">
      <a class="nav-link" href="/config/operadores"><i class="fas fa-fw fa-users"></i><span>Operadores</span></a>
    </li>
    <li class="nav-item {{ 'active' if request.url.path == '/config/cuentas' }}">
      <a class="nav-link" href="/config/cuentas"><i class="fas fa-fw fa-piggy-bank"></i><span>Cuentas bancarias</span></a>
    </li>
    <hr class="sidebar-divider d-none d-md-block">
    <li class="sidebar-footer">
      <div class="txt">Desarrollado por</div>
      <div class="logo-chip"><img src="/static/img/kleba-logo.png" alt="Kleba Dev"></div>
    </li>
  </ul>
  <div id="content-wrapper" class="d-flex flex-column">
    <div id="content">
      <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
        <ul class="navbar-nav ml-auto align-items-center">
          <li class="nav-item mr-3 text-gray-600 small">{{ user.nombre }}</li>
          <li class="nav-item">
            <form method="post" action="/logout">
              <button type="submit" class="btn btn-sm btn-outline-secondary">Salir</button>
            </form>
          </li>
        </ul>
      </nav>
      <div class="container-fluid">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</div>
{% else %}
<div class="login-wrapper">
  {% block login_content %}{% endblock %}
</div>
{% endif %}
<script src="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/vendor/jquery/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/vendor/jquery-easing/jquery.easing.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2@4.1.4/js/sb-admin-2.min.js"></script>
</body>
</html>
