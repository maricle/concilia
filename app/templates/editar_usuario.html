{% extends "base.html" %}
{% block title %}Editar usuario - Concilia{% endblock %}
{% block content %}
<h1 class="h3 mb-4 text-gray-800">Editar usuario</h1>

<div class="card shadow mb-4" style="max-width: 500px;">
  <div class="card-body">
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/config/usuarios/{{ usuario.id }}/editar">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="form-control" name="nombre" value="{{ usuario.nombre }}" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" value="{{ usuario.email }}" required>
      </div>
      <div class="form-group">
        <label>Rol</label>
        <input type="text" class="form-control" name="rol" value="{{ usuario.rol }}">
      </div>
      <div class="form-group">
        <label>Nueva contrasena</label>
        <input type="password" class="form-control" name="password" minlength="8" placeholder="Dejar en blanco para no cambiarla">
      </div>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </form>
  </div>
</div>
{% endblock %}
